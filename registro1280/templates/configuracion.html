<main class="config">
  <section class="panel panel-correo" aria-labelledby="t-correo">
    <div class="panel-cabeza">
      <h2 id="t-correo">Envío por correo</h2>
      <span class="estado" id="correo-estado">–</span>
    </div>
    <p class="detalle-panel" id="correo-config-detalle"></p>

    <form class="fila" data-tipo="correo">
      <div class="campo minutos"><label for="correo-minutos">Enviar cada (minutos)</label>
        <input id="correo-minutos" name="datos" inputmode="numeric" pattern="[0-9]*" maxlength="5" required></div>
      <div class="botones">
        <button type="submit" class="primario" id="correo-activar">Activar</button>
        <button type="button" data-tipo="correo" data-datos="detener">Detener</button>
      </div>
    </form>

    <form id="form-destinatarios" class="destinatarios">
      <div class="listas">
        <fieldset class="lista">
          <legend>Para</legend>
          <div id="lista-para"></div>
          <button type="button" class="agregar" data-lista="para">+ Agregar correo</button>
        </fieldset>
        <fieldset class="lista">
          <legend>Copia</legend>
          <div id="lista-copia"></div>
          <button type="button" class="agregar" data-lista="copia">+ Agregar correo</button>
        </fieldset>
      </div>
      <div class="botones"><button type="submit" class="primario">Guardar destinatarios</button></div>
    </form>

    <form class="fila" data-tipo="correo_cuenta" autocomplete="off">
      <div class="campo"><label for="correo-cuenta">Cuenta de Gmail que envía</label>
        <input id="correo-cuenta" name="usuario" type="email" maxlength="254" required autocomplete="off"></div>
      <div class="campo"><label for="correo-clave">Contraseña de aplicación (16 letras)</label>
        <div class="con-ojo">
          <input id="correo-clave" name="clave" type="password" maxlength="100" required autocomplete="new-password">
          <button type="button" id="ver-clave" aria-pressed="false">Ver</button>
        </div></div>
      <div class="botones"><button type="submit">Guardar cuenta</button></div>
      <p class="ayuda">Se prueba en Gmail antes de guardar.</p>
    </form>
    <p class="resultado" id="res-correo" role="status"></p>
  </section>

  <div class="columna">
    <section class="panel" aria-labelledby="t-bucle">
      <div class="panel-cabeza">
        <h2 id="t-bucle">Guardado automático</h2>
        <span class="estado" id="bucle-estado">–</span>
      </div>
      <form class="fila" data-tipo="bucle">
        <div class="campo minutos"><label for="bucle-minutos">Guardar cada (minutos)</label>
          <input id="bucle-minutos" name="datos" inputmode="numeric" pattern="[0-9]*" maxlength="5" required></div>
        <div class="botones">
          <button type="submit" class="primario">Activar</button>
          <button type="button" data-tipo="bucle" data-datos="detener">Detener</button>
          <button type="button" data-tipo="guardar" data-datos="">Guardar ahora</button>
        </div>
      </form>
      <p class="resultado" id="res-bucle" role="status"></p>
    </section>

    <section class="panel" aria-labelledby="t-controlador">
      <div class="panel-cabeza"><h2 id="t-controlador">Controlador</h2></div>
      <form class="fila" data-tipo="controlador">
        <div class="campo"><label for="ctrl-ip">IP</label>
          <input id="ctrl-ip" name="ip" inputmode="decimal" maxlength="15" required></div>
        <div class="campo corto"><label for="ctrl-puerto">Puerto</label>
          <input id="ctrl-puerto" name="puerto" inputmode="numeric" pattern="[0-9]*" maxlength="5" required></div>
        <div class="botones">
          <button type="submit">Guardar</button>
          <button type="button" data-tipo="controlador_probar" data-datos="">Probar conexión</button>
        </div>
      </form>
      <p class="resultado" id="res-controlador" role="status"></p>
    </section>

    <section class="panel" aria-labelledby="t-comunicacion">
      <div class="panel-cabeza">
        <h2 id="t-comunicacion">Estado de comunicación</h2>
        <span class="estado" id="com-estado">–</span>
      </div>
      <form class="fila" data-tipo="comunicacion">
        <div class="campo minutos"><label for="com-segundos">Cada (segundos)</label>
          <input id="com-segundos" name="datos" inputmode="numeric" pattern="[0-9]*" maxlength="5" required></div>
        <div class="botones">
          <button type="submit" class="primario">Activar</button>
          <button type="button" data-tipo="comunicacion" data-datos="detener">Desactivar</button>
        </div>
      </form>
      <p class="resultado" id="res-comunicacion" role="status"></p>
    </section>
  </div>

  <section class="panel ancho-total" aria-labelledby="t-cambios">
    <div class="panel-cabeza"><h2 id="t-cambios">Últimos cambios y acciones</h2></div>
    <div class="tabla-caja">
      <table>
        <thead><tr><th class="n">N°</th><th>Fecha</th><th>Qué</th><th>Resultado</th><th>Detalle</th><th>Desde</th></tr></thead>
        <tbody id="pedidos"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </div>
  </section>
  <p class="version">Versión {{ version }}</p>
</main>
