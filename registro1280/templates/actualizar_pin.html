<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualizar PIN – Registro de pesadas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314212c'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' text-anchor='middle' fill='%23f0b23a'%3Ekg%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}"></head>
<body class="pagina-ingreso"><main class="ingreso">
  <h1>Actualizar acceso anterior</h1>
  <p class="sub">Reemplaza tu clave o PIN anterior por un PIN de exactamente 6 números. Este paso solo está disponible una vez para las cuentas anteriores.</p>
  <form method="post" class="tarjeta">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="usuario">Usuario actual</label>
    <input id="usuario" name="usuario" maxlength="80" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="anterior">Clave o PIN anterior</label>
    <input id="anterior" name="anterior" type="password" maxlength="1024" autocomplete="current-password" required>
    <label for="pin">Nuevo PIN (exactamente 6 dígitos)</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" title="Exactamente 6 números: ni más ni menos" autocomplete="new-password" required>
    <label for="repetir">Repetir PIN</label>
    <input id="repetir" name="repetir" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" title="Exactamente 6 números: ni más ni menos" autocomplete="new-password" required>
    {% if error %}<p class="mensaje error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="primario">Guardar PIN e ingresar</button>
  </form>
  <p><a href="{{ url_for('ingresar') }}">Volver al ingreso</a></p>
  <p class="version">Versión {{ version }}</p>
</main></body></html>
