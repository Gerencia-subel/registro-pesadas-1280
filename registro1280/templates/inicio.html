<section class="pantalla" aria-label="Estado">
  <div class="lectura principal">
    <h2>Pesadas en la base</h2>
    <p class="cifra" id="total">–</p>
    <p class="detalle" id="rango"></p>
  </div>
  <div class="lectura">
    <h2>Última descarga</h2>
    <p class="valor" id="descarga">–</p>
    <p class="detalle" id="descarga-detalle"></p>
  </div>
  <div class="lectura">
    <h2>Guardado automático</h2>
    <p class="valor" id="bucle">–</p>
    <p class="detalle" id="bucle-detalle"></p>
  </div>
  <div class="lectura">
    <h2><a class="enlace-config" href="{{ url_for('configuracion') }}" data-vista="configuracion">Envío por correo</a></h2>
    <p class="valor" id="correo">–</p>
    <p class="detalle" id="correo-detalle"></p>
  </div>
  <div class="lectura">
    <h2>Controlador</h2>
    <p class="valor" id="controlador">–</p>
    <p class="detalle" id="hora"></p>
  </div>
</section>

<main>
  <form id="filtros" class="filtros">
    <div class="campo"><label for="desde">Desde (fecha y hora de inicio)</label><input type="datetime-local" id="desde" name="desde" step="60"></div>
    <div class="campo"><label for="hasta">Hasta (fecha y hora de inicio)</label><input type="datetime-local" id="hasta" name="hasta" step="60"></div>
    <div class="campo ancho"><label for="producto">Producto</label><input id="producto" name="producto" maxlength="60" placeholder="Parte del nombre"></div>
    <div class="campo"><label for="id">ID</label><input id="id" name="id" inputmode="numeric" pattern="[0-9]*" maxlength="10"></div>
    <div class="campo"><label for="por_pagina">Filas por página</label>
      <select id="por_pagina" name="por_pagina">
        {% for t in tamanos %}<option value="{{ t }}"{% if t == 5 %} selected{% endif %}>{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="botones">
      <button type="submit" class="primario">Buscar</button>
      <button type="button" id="limpiar">Limpiar</button>
      <button type="button" id="exportar-excel">Exportar a Excel</button>
    </div>
  </form>

  <p class="mensaje" id="mensaje" role="status"></p>

  <div class="tabla-caja" tabindex="0" aria-label="Pesadas guardadas">
    <table>
      <thead>
        <tr>
          <th class="n">N°</th><th class="n">ID</th><th class="n">cor</th><th>Producto</th>
          <th class="n">Peso</th><th class="n">Acum</th><th title="Fecha de inicio">FechaI</th><th title="Fecha de fin">FechaF</th>
          <th class="n">Turno</th><th class="n">Estado</th><th>Guardado</th>
          <th class="n" title="Número del correo en que se envió">Correo</th>
        </tr>
      </thead>
      <tbody id="filas"><tr><td colspan="12" class="vacio">Cargando…</td></tr></tbody>
    </table>
  </div>

  <nav class="paginas" aria-label="Páginas">
    <button type="button" id="anterior">Anterior</button>
    <span id="pagina-texto"></span>
    <button type="button" id="siguiente">Siguiente</button>
  </nav>
  <section class="correos" aria-labelledby="titulo-correos">
    <div class="correos-cabecera">
      <h2 id="titulo-correos">Correos enviados</h2>
      <div class="campo">
        <label for="correos-por-pagina">Filas por página</label>
        <select id="correos-por-pagina">
          {% for t in tamanos %}<option value="{{ t }}"{% if t == 5 %} selected{% endif %}>{{ t }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <p class="mensaje" id="correos-mensaje" role="status"></p>
    <div class="tabla-caja" tabindex="0" aria-label="Correos enviados">
      <table>
        <thead>
          <tr>
            <th class="n">N°</th><th>Enviado</th><th>Tipo</th><th>Tramo</th><th class="n">Pesadas</th>
            <th>Resultado</th><th>Archivo</th><th>Detalle</th>
          </tr>
        </thead>
        <tbody id="correos-filas"><tr><td colspan="8" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </div>
    <nav class="paginas" aria-label="Páginas de correos">
      <button type="button" id="correos-anterior" disabled>Anterior</button>
      <span id="correos-pagina-texto"></span>
      <button type="button" id="correos-siguiente" disabled>Siguiente</button>
    </nav>
  </section>
  <p class="version">Versión {{ version }}</p>
</main>
